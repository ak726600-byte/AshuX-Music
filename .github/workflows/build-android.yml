name: Build AshuX APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: chmod +x gradlew && ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Upload AshuX Music APK
        uses: actions/upload-artifact@v4
        with:
          name: AshuX-Music-APK
          path: androidApp/build/outputs/apk/debug/*.apk
