name: Build AshuX APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pull Git Submodules Explicitly
        run: |
          git submodule init
          git submodule update --init --recursive --remote || true
          if [ ! -f "opusDecoder/src/main/cpp/opus/CMakeLists.txt" ] && [ -f ".gitmodules" ]; then
            git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | while read path_key local_path; do
              url_key=$(echo $path_key | sed 's/\.path/.url/')
              sub_url=$(git config -f .gitmodules --get "$url_key")
              rm -rf "$local_path"
              git clone --depth 1 "$sub_url" "$local_path"
            done
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :listenTogetherProto:generateProto :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Upload AshuX Music APK
        uses: actions/upload-artifact@v4
        with:
          name: AshuX-Music-APK
          path: androidApp/build/outputs/apk/debug/*.apk
